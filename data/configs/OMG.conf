; This is a function configuration file for Oh-My-GXDE.

[MetaData]
ModuleName=GXDM
ModuleVersion=1.0.0
EnableUnstable=OFF

[Stable]
SetGreeterWallpaper=ON
SetGreeterCursor=ON
SetLkScreenWallpaper=OFF
TryEnrollLkScreen=ON
SetGreeterType=ON

[NextFeatReq]
SwitchGreeterStyle=CLASSIC  ; Defaulting to CLASSIC, the other option is MODERN.
SwitchLkScrStyle=CLASSIC    ; Defaulting to CLASSIC, the other option is MODERN.
